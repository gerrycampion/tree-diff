[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-diff-py"
version = "0.1.0"
description = "Utilities for diffing nested JSON-like structures and matching list items."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tree-diff-py contributors" }]
license = { text = "MIT" }
keywords = ["diff", "json", "matching", "lists"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "pytest>=9.1.1",
    "ruff>=0.6.0",
    "build>=1.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-q"
